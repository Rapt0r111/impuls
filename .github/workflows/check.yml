name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: impuls
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: impuls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U impuls -d impuls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://impuls:test-only@127.0.0.1:5432/impuls_test
      MIGRATION_DATABASE_URL: postgres://impuls:test-only@127.0.0.1:5432/impuls_test
      TEST_DATABASE_URL: postgres://impuls:test-only@127.0.0.1:5432/impuls_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: bun install --frozen-lockfile
      - name: Provision Supabase API roles (absent in plain PostgreSQL)
        run: |
          for role in anon authenticated service_role; do
            PGPASSWORD=test-only psql -h 127.0.0.1 -U impuls -d impuls_test -v ON_ERROR_STOP=1 \
              -c "CREATE ROLE $role NOLOGIN"
          done
      - name: Dependency audit (production dependencies)
        run: bun audit --prod
      - name: Secret scan of tracked files
        run: node scripts/scan-secrets.mjs
      - run: bun run db:migrate
      - run: bun run check
        env:
          TEST_DATABASE_URL: ""
      - name: Install PostgreSQL 17 restore tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --no-install-recommends -y postgresql-client-17
      - run: bun run test:restore
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
      - run: bunx playwright install chromium --with-deps
      - name: Worker observation and POSIX stop rehearsal
        run: bun run test:worker-ops
      - run: bun run test:telegram
      - name: Workspace text resize and reflow
        run: node scripts/verify-workspace-reflow.mjs
      - run: bun run test:task-slice
