name: check

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: impuls
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: impuls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U impuls -d impuls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://impuls:test-only@127.0.0.1:5432/impuls_test
      MIGRATION_DATABASE_URL: postgres://impuls:test-only@127.0.0.1:5432/impuls_test
      TEST_DATABASE_URL: postgres://impuls:test-only@127.0.0.1:5432/impuls_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run check
      - run: bun run test:integration
      - run: bunx playwright install chromium --with-deps
      - run: bun run demo:test
