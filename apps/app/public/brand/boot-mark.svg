<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Анимированный знак на экране проверки доступа. Подключается как <img>, поэтому стили внутри файла. -->
  <style>
    .draw { stroke-dasharray: 1; }
    .frame { stroke-dasharray: 1671; }
    .spin-o, .spin-i, .spark-breathe { transform-box: view-box; }
    .spin-o, .spin-i { transform-origin: 256px 256px; }
    .spark-breathe { transform-origin: 256px 188px; }
    .leaf-l { transform-origin: 248px 192px; }
    .leaf-r { transform-origin: 264px 192px; }
    .leaf-c { transform-origin: 256px 195px; }
    .body { transform-origin: 256px 406px; }
    .spark-pop { transform-origin: 256px 188px; }
    .spark-pop, .leaf-c, .leaf-l, .leaf-r, .body, .node-tip, .node-side { transform-box: view-box; }

    @media (prefers-reduced-motion: no-preference) {
      .plate { animation: fade-in 0.6s ease-out both; }
      .frame { animation: draw-frame 0.9s cubic-bezier(0.4, 0, 0.2, 1) both; }
      .reticle { animation: fade-in 0.6s ease-out 0.4s both; }
      .glow { animation: fade-in 1s ease-out 0.6s both; }
      .spin-o { animation: spin 48s linear infinite; }
      .spin-i { animation: spin-back 30s linear infinite; }
      .leaf-l { animation: unfurl-l 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s both; }
      .leaf-r { animation: unfurl-r 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s both; }
      .leaf-c { animation: grow-y 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.45s both; }
      .node-side { animation: pop 0.5s ease-out 0.9s both; }
      .node-tip { animation: pop 0.5s ease-out 1.1s both; }
      .body { animation: grow-y 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.7s both; }
      .draw { animation: draw 0.7s ease-out both; }
      .ring-1 { animation-delay: 1.35s; }
      .ring-2 { animation-delay: 1.45s; }
      .ring-3 { animation-delay: 1.55s; }
      .spark-pop { animation: pop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 1.7s both; }
      .spark-breathe { animation: breathe 2.6s ease-in-out 2.3s infinite; }
    }

    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes draw-frame { from { stroke-dashoffset: 1671; } to { stroke-dashoffset: 0; } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes unfurl-l { from { opacity: 0; transform: rotate(-35deg) scale(0.3); } to { opacity: 1; transform: none; } }
    @keyframes unfurl-r { from { opacity: 0; transform: rotate(35deg) scale(0.3); } to { opacity: 1; transform: none; } }
    @keyframes grow-y { from { opacity: 0; transform: scaleY(0); } to { opacity: 1; transform: none; } }
    @keyframes pop { 0% { opacity: 0; transform: scale(0); } 60% { opacity: 1; transform: scale(1.25); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spin-back { to { transform: rotate(-360deg); } }
    @keyframes breathe { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
  </style>

  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#143644" />
      <stop offset="60%" stop-color="#0a1d26" />
      <stop offset="100%" stop-color="#050e14" />
    </radialGradient>
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0b5" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#ff9900" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0c2936" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="carrotBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9d1e" />
      <stop offset="40%" stop-color="#ff6a00" />
      <stop offset="100%" stop-color="#d43800" />
    </linearGradient>
    <linearGradient id="carrotHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#ffbe3b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="leafCenter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00a875" />
      <stop offset="60%" stop-color="#00f0b5" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="leafLeft" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#008a60" />
      <stop offset="70%" stop-color="#00f0b5" />
      <stop offset="100%" stop-color="#99fadc" />
    </linearGradient>
    <linearGradient id="leafRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#008a60" />
      <stop offset="70%" stop-color="#00f0b5" />
      <stop offset="100%" stop-color="#99fadc" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffbe3b" />
      <stop offset="100%" stop-color="#ff8800" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect class="plate" x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGlow)" />
  <rect class="frame" x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#squircleBorder)" stroke-width="3" />

  <g class="reticle">
    <g class="spin-o" opacity="0.18">
      <circle cx="256" cy="256" r="175" fill="none" stroke="#00f0b5" stroke-width="1.5" stroke-dasharray="6 8" />
    </g>
    <g class="spin-i" opacity="0.18">
      <circle cx="256" cy="256" r="105" fill="none" stroke="#ff9900" stroke-width="1" stroke-dasharray="3 5" />
    </g>
    <g opacity="0.18" stroke="#00f0b5" stroke-width="2">
      <line x1="256" y1="52" x2="256" y2="76" />
      <line x1="256" y1="436" x2="256" y2="460" />
      <line x1="52" y1="256" x2="76" y2="256" />
      <line x1="436" y1="256" x2="460" y2="256" />
    </g>
  </g>

  <g class="glow">
    <g opacity="0.3" filter="url(#neonGlow)">
      <circle cx="256" cy="140" r="55" fill="#00f0b5" />
      <ellipse cx="256" cy="290" rx="60" ry="90" fill="#ff7700" />
    </g>
  </g>

  <g class="leaf-l">
    <path d="M 248 190 C 230 155, 192 120, 156 108 C 182 142, 220 178, 242 194 Z" fill="url(#leafLeft)" filter="url(#coreGlow)" />
    <path d="M 248 190 C 230 155, 192 120, 156 108" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>
  <g class="leaf-r">
    <path d="M 264 190 C 282 155, 320 120, 356 108 C 330 142, 292 178, 270 194 Z" fill="url(#leafRight)" filter="url(#coreGlow)" />
    <path d="M 264 190 C 282 155, 320 120, 356 108" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>
  <g class="leaf-c">
    <path d="M 256 195 C 248 150, 244 110, 256 75 C 268 110, 264 150, 256 195 Z" fill="url(#leafCenter)" filter="url(#coreGlow)" />
    <line x1="256" y1="190" x2="256" y2="80" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>
  <circle class="node-tip" cx="256" cy="75" r="5" fill="#ffffff" filter="url(#coreGlow)" />
  <circle class="node-side" cx="156" cy="108" r="4" fill="#00f0b5" />
  <circle class="node-side" cx="356" cy="108" r="4" fill="#00f0b5" />

  <g class="body">
    <path d="M 186 198 C 186 182, 326 182, 326 198 C 326 248, 288 340, 258 406 C 257 408, 255 408, 254 406 C 224 340, 186 248, 186 198 Z" fill="url(#carrotBody)" filter="url(#coreGlow)" />
    <path d="M 188 198 C 188 184, 256 182, 256 182 C 256 220, 240 330, 256 406 C 240 360, 196 270, 188 198 Z" fill="url(#carrotHighlight)" />
    <path class="draw ring-1" pathLength="1" d="M 198 234 C 224 244, 288 244, 314 234" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <path class="draw ring-1" pathLength="1" d="M 198 234 C 224 244, 288 244, 314 234" fill="none" stroke="#ffbe3b" stroke-width="7" stroke-linecap="round" opacity="0.4" filter="url(#coreGlow)" />
    <path class="draw ring-2" pathLength="1" d="M 214 286 C 234 294, 278 294, 298 286" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <path class="draw ring-2" pathLength="1" d="M 214 286 C 234 294, 278 294, 298 286" fill="none" stroke="#ffbe3b" stroke-width="6" stroke-linecap="round" opacity="0.4" filter="url(#coreGlow)" />
    <path class="draw ring-3" pathLength="1" d="M 230 338 C 244 344, 268 344, 282 338" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <path class="draw ring-3" pathLength="1" d="M 230 338 C 244 344, 268 344, 282 338" fill="none" stroke="#ffbe3b" stroke-width="5" stroke-linecap="round" opacity="0.4" filter="url(#coreGlow)" />
    <circle cx="256" cy="406" r="4.5" fill="#ffffff" filter="url(#coreGlow)" />
  </g>

  <g class="spark-pop">
    <g class="spark-breathe">
      <circle cx="256" cy="188" r="22" fill="#ffbe3b" opacity="0.3" filter="url(#neonGlow)" />
      <path d="M 256 170 L 261 183 L 274 188 L 261 193 L 256 206 L 251 193 L 238 188 L 251 183 Z" fill="url(#sparkGrad)" filter="url(#coreGlow)" />
      <circle cx="256" cy="188" r="4" fill="#ffffff" />
    </g>
  </g>
</svg>
