<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#163842" />
      <stop offset="60%" stop-color="#0b1b23" />
      <stop offset="100%" stop-color="#061016" />
    </radialGradient>
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70e1c2" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#2a5360" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0e2630" stop-opacity="0.8" />
    </linearGradient>

    <!-- Pillar Gradients -->
    <linearGradient id="pillarLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8f5e1" />
      <stop offset="35%" stop-color="#55cbb0" />
      <stop offset="100%" stop-color="#184b4e" />
    </linearGradient>
    <linearGradient id="pillarRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70e1c2" />
      <stop offset="65%" stop-color="#2c726d" />
      <stop offset="100%" stop-color="#12373c" />
    </linearGradient>

    <!-- Pulse Wave Gradients -->
    <linearGradient id="pulseGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70e1c2" />
      <stop offset="48%" stop-color="#ffffff" />
      <stop offset="52%" stop-color="#f6d083" />
      <stop offset="100%" stop-color="#70e1c2" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Shield -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGlow)" stroke="url(#squircleBorder)" stroke-width="3" />

  <!-- Technical Reticle & Grid Details (Subtle) -->
  <g opacity="0.18">
    <circle cx="256" cy="256" r="170" fill="none" stroke="#70e1c2" stroke-width="1.5" stroke-dasharray="6 8" />
    <circle cx="256" cy="256" r="90" fill="none" stroke="#70e1c2" stroke-width="1" stroke-dasharray="3 5" />
    <line x1="256" y1="56" x2="256" y2="76" stroke="#70e1c2" stroke-width="2" />
    <line x1="256" y1="436" x2="256" y2="456" stroke="#70e1c2" stroke-width="2" />
    <line x1="56" y1="256" x2="76" y2="256" stroke="#70e1c2" stroke-width="2" />
    <line x1="436" y1="256" x2="456" y2="256" stroke="#70e1c2" stroke-width="2" />
  </g>

  <!-- Left Monolith Pillar of "И" -->
  <rect x="124" y="128" width="48" height="256" rx="14" fill="url(#pillarLeft)" filter="url(#coreGlow)" />
  <rect x="130" y="134" width="10" height="244" rx="5" fill="#ffffff" opacity="0.35" />

  <!-- Right Monolith Pillar of "И" -->
  <rect x="340" y="128" width="48" height="256" rx="14" fill="url(#pillarRight)" filter="url(#coreGlow)" />
  <rect x="346" y="134" width="10" height="244" rx="5" fill="#ffffff" opacity="0.25" />

  <!-- Ambient Wave Glow behind the pulse -->
  <path d="M 148 340 L 200 340 L 228 368 L 256 142 L 284 316 L 312 210 L 336 210 L 364 172"
        fill="none" stroke="#70e1c2" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.15" filter="url(#neonGlow)" />

  <!-- Dynamic Impulse Line (Connecting diagonal of "И" via energy pulse) -->
  <path d="M 148 340 L 200 340 L 228 368 L 256 142 L 284 316 L 312 210 L 336 210 L 364 172"
        fill="none" stroke="url(#pulseGlow)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Inner High-Intensity White Core -->
  <path d="M 148 340 L 200 340 L 228 368 L 256 142 L 284 316 L 312 210 L 336 210 L 364 172"
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Peak Impulse Nodes -->
  <!-- Top Apex Energy Spark (Gold) -->
  <circle cx="256" cy="142" r="10" fill="#f6d083" filter="url(#coreGlow)" />
  <circle cx="256" cy="142" r="4.5" fill="#ffffff" />

  <!-- Secondary Nodes -->
  <circle cx="228" cy="368" r="6" fill="#70e1c2" />
  <circle cx="284" cy="316" r="6" fill="#70e1c2" />
  <circle cx="312" cy="210" r="5" fill="#a8f5e1" />

  <!-- Micro Technical Coordinates Label -->
  <g opacity="0.45" transform="translate(256, 428)">
    <text text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#a0bec8">
      IMPULSE // R-01 CORE
    </text>
  </g>
</svg>
