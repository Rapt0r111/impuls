<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#08151c" />
      <stop offset="50%" stop-color="#0c1f28" />
      <stop offset="100%" stop-color="#08151c" />
    </linearGradient>

    <!-- Pillar Gradients -->
    <linearGradient id="hPillarLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8f5e1" />
      <stop offset="100%" stop-color="#2c726d" />
    </linearGradient>
    <linearGradient id="hPillarRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70e1c2" />
      <stop offset="100%" stop-color="#184b4e" />
    </linearGradient>

    <linearGradient id="hPulseGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70e1c2" />
      <stop offset="48%" stop-color="#ffffff" />
      <stop offset="52%" stop-color="#f6d083" />
      <stop offset="100%" stop-color="#70e1c2" />
    </linearGradient>

    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d083" />
      <stop offset="100%" stop-color="#ffdca0" />
    </linearGradient>

    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="760" height="160" rx="20" fill="url(#bgH)" stroke="#223942" stroke-width="1.5" />

  <!-- Subtle grid dots in background -->
  <g opacity="0.12">
    <circle cx="280" cy="40" r="1.5" fill="#70e1c2" />
    <circle cx="340" cy="40" r="1.5" fill="#70e1c2" />
    <circle cx="400" cy="40" r="1.5" fill="#70e1c2" />
    <circle cx="460" cy="40" r="1.5" fill="#70e1c2" />
    <circle cx="520" cy="40" r="1.5" fill="#70e1c2" />
    <circle cx="580" cy="40" r="1.5" fill="#70e1c2" />
    <circle cx="640" cy="40" r="1.5" fill="#70e1c2" />
    <circle cx="700" cy="40" r="1.5" fill="#70e1c2" />

    <circle cx="280" cy="120" r="1.5" fill="#70e1c2" />
    <circle cx="340" cy="120" r="1.5" fill="#70e1c2" />
    <circle cx="400" cy="120" r="1.5" fill="#70e1c2" />
    <circle cx="460" cy="120" r="1.5" fill="#70e1c2" />
    <circle cx="520" cy="120" r="1.5" fill="#70e1c2" />
    <circle cx="580" cy="120" r="1.5" fill="#70e1c2" />
    <circle cx="640" cy="120" r="1.5" fill="#70e1c2" />
    <circle cx="700" cy="120" r="1.5" fill="#70e1c2" />
  </g>

  <!-- BRAND MARK (Scaled and centered at left, X: 40..152, Y: 24..136) -->
  <g transform="translate(40, 24)">
    <!-- Base Squircle -->
    <rect width="112" height="112" rx="28" fill="#0d242e" stroke="#70e1c2" stroke-opacity="0.45" stroke-width="1.5" />
    
    <!-- Reticle arc -->
    <circle cx="56" cy="56" r="40" fill="none" stroke="#70e1c2" stroke-width="1" stroke-dasharray="2 4" opacity="0.25" />

    <!-- Left Pillar -->
    <rect x="26" y="27" width="11" height="58" rx="3.5" fill="url(#hPillarLeft)" />
    <!-- Right Pillar -->
    <rect x="75" y="27" width="11" height="58" rx="3.5" fill="url(#hPillarRight)" />

    <!-- Pulse Wave -->
    <path d="M 32 75 L 43 75 L 49 81 L 56 31 L 62 69 L 69 46 L 74 46 L 80 37"
          fill="none" stroke="url(#hPulseGlow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#hGlow)" />
    <path d="M 32 75 L 43 75 L 49 81 L 56 31 L 62 69 L 69 46 L 74 46 L 80 37"
          fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Apex Spark -->
    <circle cx="56" cy="31" r="2.8" fill="#f6d083" />
  </g>

  <!-- WORDMARK: ИМПУЛЬС -->
  <g transform="translate(182, 78)">
    <text font-family="'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif"
          font-size="44" font-weight="800" letter-spacing="4" fill="#edf5f2">
      ИМПУЛЬС
    </text>
  </g>

  <!-- BADGE / PILL: НАУЧНАЯ РОТА -->
  <g transform="translate(485, 48)">
    <rect width="124" height="26" rx="6" fill="#143935" stroke="#70e1c2" stroke-opacity="0.5" stroke-width="1" />
    <text x="62" y="17" text-anchor="middle"
          font-family="'Manrope', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#99eacf">
      НАУЧНАЯ РОТА
    </text>
  </g>

  <!-- DESCRIPTOR SUBTITLE -->
  <g transform="translate(184, 112)">
    <text font-family="'Manrope', system-ui, sans-serif"
          font-size="12" font-weight="500" letter-spacing="2" fill="#8ca6af">
      СИСТЕМА УЧЁТА ЗАДАЧ • РЕЙТИНГ • ПООЩРЕНИЯ
    </text>
  </g>

  <!-- Accent Energy Bar Divider -->
  <rect x="184" y="88" width="530" height="1.5" fill="#24424e" />
  <rect x="184" y="88" width="60" height="1.5" fill="#70e1c2" opacity="0.8" />
  <circle cx="244" cy="88.75" r="2.5" fill="#f6d083" />
</svg>
