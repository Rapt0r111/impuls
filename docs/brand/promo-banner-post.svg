<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="pBgGlow" cx="50%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#143440" />
      <stop offset="45%" stop-color="#091820" />
      <stop offset="100%" stop-color="#040c10" />
    </radialGradient>

    <!-- Phone Card Gradient -->
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2630" />
      <stop offset="100%" stop-color="#08151c" />
    </linearGradient>

    <!-- Mint Gradient -->
    <linearGradient id="pMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70e1c2" />
      <stop offset="100%" stop-color="#2a7d6d" />
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="pGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d083" />
      <stop offset="100%" stop-color="#c99e43" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="pNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1080" height="1080" fill="url(#pBgGlow)" />

  <!-- Ambient Grid & Technical Lines -->
  <g opacity="0.12" stroke="#70e1c2" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="1080" />
    <line x1="1000" y1="0" x2="1000" y2="1080" />
    <line x1="0" y1="120" x2="1080" y2="120" />
    <line x1="0" y1="960" x2="1080" y2="960" />
    <circle cx="540" cy="540" r="420" fill="none" stroke-dasharray="6 8" />
  </g>

  <!-- Top Ambient Glow Spot -->
  <circle cx="540" cy="80" r="260" fill="#70e1c2" opacity="0.12" filter="url(#pNeon)" />

  <!-- HEADER -->
  <g transform="translate(80, 60)">
    <!-- Brand Mark Mini -->
    <rect width="48" height="48" rx="12" fill="#112933" stroke="#70e1c2" stroke-width="1.5" />
    <path d="M 14 34 L 18 34 L 21 37 L 24 14 L 27 31 L 30 21 L 34 16"
          fill="none" stroke="#70e1c2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="24" cy="14" r="2" fill="#f6d083" />

    <!-- Brand Name -->
    <text x="64" y="34" font-family="'Manrope', sans-serif" font-size="24" font-weight="800" letter-spacing="3" fill="#edf5f2">
      СТИМУЛ
    </text>

    <!-- Tag -->
    <rect x="230" y="10" width="168" height="28" rx="6" fill="#153b34" stroke="#70e1c2" stroke-width="1" stroke-opacity="0.5" />
    <text x="314" y="28" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#99eacf">
      TELEGRAM MINI APP
    </text>

    <!-- Right-aligned Target Audience -->
    <text x="920" y="32" text-anchor="end" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#819ba5">
      СПЕЦИАЛЬНО ДЛЯ НАУЧНОЙ РОТЫ
    </text>
  </g>

  <!-- HEADLINE BLOCK -->
  <g transform="translate(80, 175)">
    <text font-family="'Manrope', sans-serif" font-size="44" font-weight="800" line-height="1.15" fill="#ffffff" letter-spacing="-1">
      ТВОЙ ВКЛАД В НАУКУ И СЛУЖБУ
    </text>
    <text y="58" font-family="'Manrope', sans-serif" font-size="44" font-weight="800" fill="url(#pMint)" letter-spacing="-1">
      ТЕПЕРЬ ИМЕЕТ ИЗМЕРИМЫЙ ВЕС
    </text>
    <text y="108" font-family="'Manrope', sans-serif" font-size="18" font-weight="400" fill="#9db4bd">
      Выполняй научные и служебные задачи • Накапливай XP • Получай баллы и согласуемые поощрения
    </text>
  </g>

  <!-- MOCKUP PHONE / INTERFACE SHOWCASE (Centered, X: 300..780) -->
  <g transform="translate(320, 315)" filter="url(#phoneShadow)">
    <!-- Device Frame -->
    <rect width="440" height="520" rx="36" fill="url(#phoneBg)" stroke="#2b4752" stroke-width="2" />

    <!-- Speaker Bar / Dynamic Island -->
    <rect x="170" y="14" width="100" height="8" rx="4" fill="#040b0f" />

    <!-- Profile Header Row -->
    <g transform="translate(24, 44)">
      <!-- Avatar with Ring -->
      <circle cx="24" cy="24" r="22" fill="#183640" stroke="#70e1c2" stroke-width="2" />
      <text x="24" y="30" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="15" font-weight="700" fill="#edf5f2">АВ</text>
      
      <!-- Name & Role -->
      <text x="58" y="20" font-family="'Manrope', sans-serif" font-size="15" font-weight="700" fill="#edf5f2">Рядовой Васильев</text>
      <text x="58" y="36" font-family="'Manrope', sans-serif" font-size="11" font-weight="500" fill="#7ba0ad">1-й взвод • Web &amp; Исследования</text>

      <!-- Level Pill -->
      <rect x="290" y="8" width="94" height="26" rx="13" fill="#163c35" stroke="#70e1c2" stroke-width="1" />
      <text x="337" y="25" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#99eacf">УРОВЕНЬ 4</text>
    </g>

    <!-- METRICS ROW: XP + BALANCES -->
    <g transform="translate(24, 114)">
      <!-- Card Left: XP & Progress -->
      <rect width="190" height="88" rx="16" fill="#12242c" stroke="#253c45" stroke-width="1" />
      <text x="16" y="24" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" fill="#7c96a0">ОПЫТ В СЕЗОНЕ</text>
      <text x="16" y="56" font-family="'Manrope', sans-serif" font-size="24" font-weight="800" fill="#70e1c2">1 420 <tspan font-size="13" font-weight="600">XP</tspan></text>
      <!-- Progress Bar -->
      <rect x="16" y="68" width="158" height="6" rx="3" fill="#081419" />
      <rect x="16" y="68" width="112" height="6" rx="3" fill="#70e1c2" />

      <!-- Card Right: Spendable Points (GOLD) -->
      <g transform="translate(202, 0)">
        <rect width="190" height="88" rx="16" fill="#20251d" stroke="#5a4d2c" stroke-width="1" />
        <text x="16" y="24" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" fill="#bfaf84">БАЛЛЫ К ОПЛАТЕ</text>
        <text x="16" y="56" font-family="'Manrope', sans-serif" font-size="24" font-weight="800" fill="#f6d083">450 <tspan font-size="13" font-weight="600">pts</tspan></text>
        <text x="16" y="74" font-family="'Manrope', sans-serif" font-size="10" font-weight="500" fill="#9e916b">Зарезервировано: 120</text>
      </g>
    </g>

    <!-- ACTIVE TASK HERO CARD -->
    <g transform="translate(24, 218)">
      <rect width="392" height="136" rx="18" fill="#132933" stroke="#2c515e" stroke-width="1.2" />
      
      <!-- Status Tag -->
      <rect x="16" y="16" width="94" height="20" rx="5" fill="#1c473f" />
      <text x="63" y="30" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" fill="#70e1c2">В РАБОТЕ</text>
      
      <!-- Deadline Tag -->
      <text x="376" y="30" text-anchor="end" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" fill="#ffb9a9">Срок: сегодня, 18:00</text>

      <!-- Task Title -->
      <text x="16" y="64" font-family="'Manrope', sans-serif" font-size="15" font-weight="700" fill="#edf5f2">
        Разработка модуля шифрования и API
      </text>
      <text x="16" y="82" font-family="'Manrope', sans-serif" font-size="12" font-weight="400" fill="#8ca7b1">
        НИР «Астра-2» • Этап 2 из 3 • Код и тесты
      </text>

      <!-- Reward Award Footer -->
      <line x1="16" y1="98" x2="376" y2="98" stroke="#223e49" stroke-width="1" />
      <text x="16" y="120" font-family="'Manrope', sans-serif" font-size="12" font-weight="600" fill="#7c9ea8">
        Награда за приёмку: <tspan fill="#70e1c2" font-weight="700">+150 XP</tspan> и <tspan fill="#f6d083" font-weight="700">+50 баллов</tspan>
      </text>
    </g>

    <!-- REWARDS ROW QUICK LOOK -->
    <g transform="translate(24, 370)">
      <text font-family="'Manrope', sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#7a97a2">
        ДОСТУПНЫЕ ПООЩРЕНИЯ:
      </text>

      <!-- Reward Pill 1 -->
      <g transform="translate(0, 16)">
        <rect width="188" height="42" rx="10" fill="#15272e" stroke="#2e4a55" stroke-width="1" />
        <text x="14" y="26" font-family="'Manrope', sans-serif" font-size="12" font-weight="600" fill="#edf5f2">Увольнение (сутки)</text>
        <text x="174" y="26" text-anchor="end" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#f6d083">300 б.</text>
      </g>

      <!-- Reward Pill 2 -->
      <g transform="translate(204, 16)">
        <rect width="188" height="42" rx="10" fill="#15272e" stroke="#2e4a55" stroke-width="1" />
        <text x="14" y="26" font-family="'Manrope', sans-serif" font-size="12" font-weight="600" fill="#edf5f2">Благодарность роты</text>
        <text x="174" y="26" text-anchor="end" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#f6d083">120 б.</text>
      </g>
    </g>

    <!-- Bottom Navigation Bar inside phone -->
    <g transform="translate(0, 464)">
      <rect width="440" height="56" fill="#0b1b22" rx="0" />
      <line x1="0" y1="0" x2="440" y2="0" stroke="#1d3842" stroke-width="1" />
      <text x="55" y="34" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#70e1c2">Главная</text>
      <text x="145" y="34" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="500" fill="#69858f">Задачи</text>
      <text x="220" y="34" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="500" fill="#69858f">Рейтинг</text>
      <text x="300" y="34" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="500" fill="#69858f">Каталог</text>
      <text x="385" y="34" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="500" fill="#69858f">Ещё</text>
    </g>
  </g>

  <!-- LEFT & RIGHT HIGHLIGHT PILLARS (Callout Cards) -->
  <!-- Left Callout Card: Для кого -->
  <g transform="translate(80, 480)">
    <rect width="210" height="150" rx="16" fill="#0b1b23" stroke="#1c3a45" stroke-width="1.2" />
    <circle cx="36" cy="36" r="16" fill="#14363a" />
    <path d="M 30 36 L 34 40 L 43 31" fill="none" stroke="#70e1c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="62" y="40" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#edf5f2">Прозрачность</text>
    <text x="20" y="76" font-family="'Manrope', sans-serif" font-size="12" font-weight="400" fill="#8ca8b3">
      Критерии и награда
    </text>
    <text x="20" y="96" font-family="'Manrope', sans-serif" font-size="12" font-weight="400" fill="#8ca8b3">
      зафиксированы заранее.
    </text>
    <text x="20" y="116" font-family="'Manrope', sans-serif" font-size="12" font-weight="400" fill="#8ca8b3">
      Никаких скрытых условий.
    </text>
  </g>

  <!-- Left Callout Card 2: Рейтинг -->
  <g transform="translate(80, 655)">
    <rect width="210" height="150" rx="16" fill="#0b1b23" stroke="#1c3a45" stroke-width="1.2" />
    <circle cx="36" cy="36" r="16" fill="#36301a" />
    <polygon points="36,26 39,33 46,34 41,39 42,46 36,42 30,46 31,39 26,34 33,33" fill="#f6d083" />
    <text x="62" y="40" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#edf5f2">Несгораемый XP</text>
    <text x="20" y="76" font-family="'Manrope', sans-serif" font-size="12" font-weight="400" fill="#8ca8b3">
      Опыт остаётся навсегда,
    </text>
    <text x="20" y="96" font-family="'Manrope', sans-serif" font-size="12" font-weight="400" fill="#8ca8b3">
      даже когда ты тратишь
    </text>
    <text x="20" y="116" font-family="'Manrope', sans-serif" font-size="12" font-weight="400" fill="#8ca8b3">
      баллы в каталоге.
    </text>
  </g>

  <!-- Right Callout Card 1: Командирам -->
  <g transform="translate(790, 480)">
    <rect width="210" height="150" rx="16" fill="#0b1b23" stroke="#1c3a45" stroke-width="1.2" />
    <circle cx="36" cy="36" r="16" fill="#14363a" />
    <path d="M 28 36 L 44 36 M 36 28 L 36 44" fill="none" stroke="#70e1c2" stroke-width="2" stroke-linecap="round" />
    <text x="62" y="40" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#edf5f2">Для командиров</text>
    <text x="20" y="76" font-family="'Manrope', sans-serif" font-size="12" font-weight="400" fill="#8ca8b3">
      Удобная очередь
    </text>
    <text x="20" y="96" font-family="'Manrope', sans-serif" font-size="12" font-weight="400" fill="#8ca8b3">
      приёмки результатов
    </text>
    <text x="20" y="116" font-family="'Manrope', sans-serif" font-size="12" font-weight="400" fill="#8ca8b3">
      и гибкие бонусы наград.
    </text>
  </g>

  <!-- Right Callout Card 2: Без установки -->
  <g transform="translate(790, 655)">
    <rect width="210" height="150" rx="16" fill="#0b1b23" stroke="#1c3a45" stroke-width="1.2" />
    <circle cx="36" cy="36" r="16" fill="#1a2e38" />
    <path d="M 27 36 L 45 28 L 40 43 L 34 38 Z" fill="#70e1c2" />
    <text x="62" y="40" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#edf5f2">Прямо в Telegram</text>
    <text x="20" y="76" font-family="'Manrope', sans-serif" font-size="12" font-weight="400" fill="#8ca8b3">
      Никаких сторонних
    </text>
    <text x="20" y="96" font-family="'Manrope', sans-serif" font-size="12" font-weight="400" fill="#8ca8b3">
      приложений. Работает
    </text>
    <text x="20" y="116" font-family="'Manrope', sans-serif" font-size="12" font-weight="400" fill="#8ca8b3">
      на любом телефоне.
    </text>
  </g>

  <!-- BOTTOM CALL-TO-ACTION BAR -->
  <g transform="translate(80, 880)">
    <!-- Glow behind button -->
    <rect width="920" height="120" rx="24" fill="#0c1f28" stroke="#254b58" stroke-width="2" />
    
    <!-- Left text in CTA -->
    <text x="40" y="52" font-family="'Manrope', sans-serif" font-size="22" font-weight="800" fill="#edf5f2">
      Готовы включиться в рабочий поток?
    </text>
    <text x="40" y="82" font-family="'Manrope', sans-serif" font-size="15" font-weight="500" fill="#8da9b4">
      Открывай Telegram-бот подразделения и следи за своими задачами
    </text>

    <!-- Action Button (Mint Glowing) -->
    <g transform="translate(620, 28)">
      <rect width="260" height="64" rx="16" fill="#70e1c2" filter="url(#pNeon)" />
      <text x="130" y="39" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="16" font-weight="800" fill="#08151c" letter-spacing="0.5">
        ОТКРЫТЬ MINI APP ➔
      </text>
    </g>
  </g>
</svg>
