<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 460" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e232b" />
      <stop offset="70%" stop-color="#07141a" />
      <stop offset="100%" stop-color="#040b0f" />
    </linearGradient>

    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbe3b" />
      <stop offset="50%" stop-color="#cda34b" />
      <stop offset="100%" stop-color="#ffbe3b" />
    </linearGradient>

    <linearGradient id="mintWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0b5" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00f0b5" />
    </linearGradient>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- CHEVRON SHIELD PATH -->
  <!-- Outer Border -->
  <path d="M 190 20 L 340 50 L 340 280 C 340 360 260 415 190 440 C 120 415 40 360 40 280 L 40 50 Z"
        fill="url(#shieldGrad)" stroke="url(#goldEdge)" stroke-width="4" stroke-linejoin="round" />

  <!-- Inner Inset Shield Line -->
  <path d="M 190 34 L 324 60 L 324 275 C 324 345 250 396 190 420 C 130 396 56 345 56 275 L 56 60 Z"
        fill="none" stroke="#25434d" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Technical Angular Corners -->
  <g stroke="#00f0b5" stroke-width="2" opacity="0.6">
    <path d="M 70 80 L 70 70 L 80 70" fill="none" />
    <path d="M 310 80 L 310 70 L 300 70" fill="none" />
  </g>

  <!-- TOP HEADER LABEL -->
  <text x="190" y="88" text-anchor="middle"
        font-family="'Manrope', system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="3" fill="#ffbe3b">
    НАУЧНАЯ РОТА
  </text>
  <text x="190" y="106" text-anchor="middle"
        font-family="'Manrope', system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="2" fill="#75939e">
    ТЕХНОЛОГИИ • МОТИВАЦИЯ
  </text>

  <!-- Separator Line -->
  <line x1="90" y1="120" x2="290" y2="120" stroke="#25434d" stroke-width="1" />
  <circle cx="190" cy="120" r="3" fill="#00f0b5" />

  <!-- CENTRAL EMBLEM CORE -->
  <g transform="translate(190, 225)">
    <!-- Central Halo Circle -->
    <circle cx="0" cy="0" r="70" fill="#0c1d25" stroke="#2a4c58" stroke-width="2" />
    <circle cx="0" cy="0" r="58" fill="none" stroke="#00f0b5" stroke-width="1" stroke-dasharray="3 5" opacity="0.3" />

    <!-- Scaled Cyber-Carrot Mark -->
    <g transform="translate(-56, -56) scale(0.21875)">
      <!-- Leaves -->
      <path d="M 256 195 C 248 150, 244 110, 256 75 C 268 110, 264 150, 256 195 Z" fill="#00f0b5" />
      <path d="M 248 190 C 230 155, 192 120, 156 108 C 182 142, 220 178, 242 194 Z" fill="#00f0b5" />
      <path d="M 264 190 C 282 155, 320 120, 356 108 C 330 142, 292 178, 270 194 Z" fill="#00f0b5" />
      <!-- Carrot Body -->
      <path d="M 186 198 C 186 182, 326 182, 326 198 C 326 248, 288 340, 258 406 C 257 408, 255 408, 254 406 C 224 340, 186 248, 186 198 Z" fill="#ff7700" />
      <!-- Energy Rings -->
      <path d="M 198 234 C 224 244, 288 244, 314 234" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
      <path d="M 214 286 C 234 294, 278 294, 298 286" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
      <path d="M 230 338 C 244 344, 268 344, 282 338" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
      <!-- Spark -->
      <circle cx="256" cy="188" r="16" fill="#ffbe3b" />
      <circle cx="256" cy="188" r="7" fill="#ffffff" />
    </g>
  </g>

  <!-- LOWER TITLE: СТИМУЛ -->
  <g transform="translate(190, 335)">
    <text text-anchor="middle" font-family="'Manrope', system-ui, sans-serif"
          font-size="28" font-weight="800" letter-spacing="4" fill="#edf5f2">
      СТИМУЛ
    </text>
  </g>

  <g transform="translate(190, 360)">
    <rect x="-65" y="-12" width="130" height="22" rx="5" fill="#133630" stroke="#00f0b5" stroke-width="1" stroke-opacity="0.4" />
    <text text-anchor="middle" y="3" font-family="'Manrope', system-ui, sans-serif"
          font-size="9.5" font-weight="700" letter-spacing="1.5" fill="#99eacf">
      ЗАКРЫТЫЙ ПИЛОТ
    </text>
  </g>

  <!-- Micro Serial Number / Bottom Decor -->
  <text x="190" y="398" text-anchor="middle"
        font-family="'Consolas', monospace" font-size="8.5" letter-spacing="2" fill="#58747f">
    SEC-ID: NR-2026-F01
  </text>
</svg>
