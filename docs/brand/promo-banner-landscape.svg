<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <radialGradient id="landBg" cx="70%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#143642" />
      <stop offset="50%" stop-color="#081720" />
      <stop offset="100%" stop-color="#030b0e" />
    </radialGradient>

    <linearGradient id="lMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70e1c2" />
      <stop offset="100%" stop-color="#2a7d6d" />
    </linearGradient>

    <filter id="lGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#landBg)" />

  <!-- Cybernetic Grid & Decorative Rings -->
  <g opacity="0.15" stroke="#70e1c2">
    <circle cx="950" cy="315" r="320" fill="none" stroke-width="1.5" stroke-dasharray="6 8" />
    <circle cx="950" cy="315" r="180" fill="none" stroke-width="1" stroke-dasharray="3 4" />
    <line x1="80" y1="0" x2="80" y2="630" stroke-width="1" />
    <line x1="0" y1="550" x2="1200" y2="550" stroke-width="1" />
  </g>

  <!-- Left Column: Branding, Title, Pitch -->
  <g transform="translate(80, 80)">
    <!-- Brand Tag -->
    <rect width="180" height="32" rx="8" fill="#143833" stroke="#70e1c2" stroke-width="1" stroke-opacity="0.6" />
    <text x="90" y="21" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#99eacf">
      НАУЧНАЯ РОТА • СЕРВИС
    </text>

    <!-- Main Title -->
    <text y="90" font-family="'Manrope', sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
      ИМПУЛЬС
    </text>
    <text y="145" font-family="'Manrope', sans-serif" font-size="28" font-weight="700" fill="url(#lMint)">
      Система учёта задач, рейтинга и признания
    </text>

    <!-- Body description -->
    <text y="200" font-family="'Manrope', sans-serif" font-size="16" font-weight="400" fill="#9ab0b8">
      Единый рабочий центр для бойцов и командиров: понятные критерии,
    </text>
    <text y="228" font-family="'Manrope', sans-serif" font-size="16" font-weight="400" fill="#9ab0b8">
      несгораемый опыт, расходуемые баллы и каталог согласованных поощрений.
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 280)">
      <!-- Item 1 -->
      <g>
        <circle cx="16" cy="16" r="14" fill="#143734" />
        <path d="M 11 16 L 15 20 L 22 12" fill="none" stroke="#70e1c2" stroke-width="2" />
        <text x="40" y="21" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#edf5f2">Задачи и этапы</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(190, 0)">
        <circle cx="16" cy="16" r="14" fill="#302814" />
        <polygon points="16,8 18,13 24,14 19,18 20,24 16,21 12,24 13,18 8,14 14,13" fill="#f6d083" />
        <text x="40" y="21" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#edf5f2">Рейтинг роты</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(370, 0)">
        <circle cx="16" cy="16" r="14" fill="#1b2e38" />
        <path d="M 10 16 L 22 16 M 16 10 L 16 22" stroke="#70e1c2" stroke-width="2" />
        <text x="40" y="21" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#edf5f2">Каталог наград</text>
      </g>
    </g>

    <!-- Launch CTA -->
    <g transform="translate(0, 360)">
      <rect width="250" height="54" rx="14" fill="#70e1c2" />
      <text x="125" y="34" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="15" font-weight="800" fill="#08151c">
        ОТКРЫТЬ В TELEGRAM ➔
      </text>
    </g>
  </g>

  <!-- Right Visual: Isometric / Angled Cards Stack -->
  <g transform="translate(800, 110)">
    <!-- Background Card (Points Wallet) -->
    <g transform="translate(40, 20)">
      <rect width="280" height="150" rx="20" fill="#19231c" stroke="#4a3e23" stroke-width="1.5" opacity="0.85" />
      <text x="24" y="44" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#c7b481">БАЛЛЫ К ОПЛАТЕ</text>
      <text x="24" y="90" font-family="'Manrope', sans-serif" font-size="36" font-weight="800" fill="#f6d083">450 <tspan font-size="18">pts</tspan></text>
      <text x="24" y="118" font-family="'Manrope', sans-serif" font-size="12" font-weight="500" fill="#8f8158">Резерв: 120 баллов на увольнение</text>
    </g>

    <!-- Foreground Card (Active Task & Milestone) -->
    <g transform="translate(0, 150)">
      <rect width="320" height="230" rx="22" fill="#0d232c" stroke="#254d5c" stroke-width="2" />
      <g transform="translate(20, 20)">
        <rect width="90" height="24" rx="6" fill="#1b423a" />
        <text x="45" y="16" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#70e1c2">В РАБОТЕ</text>

        <text y="64" font-family="'Manrope', sans-serif" font-size="16" font-weight="700" fill="#edf5f2">
          Разработка API модуля
        </text>
        <text y="88" font-family="'Manrope', sans-serif" font-size="13" font-weight="400" fill="#8aa2ac">
          НИР роты • Завершение этапа
        </text>

        <!-- Progress bar -->
        <rect y="110" width="280" height="6" rx="3" fill="#081418" />
        <rect y="110" width="190" height="6" rx="3" fill="#70e1c2" />

        <line x1="0" y1="135" x2="280" y2="135" stroke="#1d3842" stroke-width="1" />
        
        <text y="160" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#7998a3">
          Награда: <tspan fill="#70e1c2" font-weight="700">+150 XP</tspan> и <tspan fill="#f6d083" font-weight="700">+50 баллов</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
